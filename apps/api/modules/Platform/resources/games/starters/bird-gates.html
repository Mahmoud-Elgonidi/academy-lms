<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>بوابات ريشة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, sans-serif;
    background: linear-gradient(180deg, #5ec8f2 0%, #a8e2f7 55%, #ffe9c4 100%);
    color: #17324d; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #sky { position: absolute; inset: 0; overflow: hidden; }
  .sun { position: absolute; top: 6%; left: 8%; width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, #fff6c9 0%, #ffd75e 45%, rgba(255, 215, 94, 0) 70%); }
  .cloud { position: absolute; top: 0; left: 0; border-radius: 999px; background: #fff; opacity: .85; filter: blur(.4px); }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 55%; height: 140%; top: -60%; left: 15%; }
  .cloud::after { width: 40%; height: 110%; top: -40%; left: 50%; }
  .isle { position: absolute; bottom: 0; }
  #top { position: absolute; top: 0; left: 0; right: 0; padding: 12px 14px 8px; z-index: 5;
    display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #prompt { font-weight: 800; font-size: clamp(15px, 4.2vw, 22px); background: rgba(255,255,255,.75);
    padding: 6px 16px; border-radius: 999px; box-shadow: 0 4px 0 rgba(23, 50, 77, .12); text-align: center; max-width: 94%; }
  #strip { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 96%; min-height: 34px; }
  .slot { min-width: 46px; padding: 5px 10px; border-radius: 12px; font-weight: 800; font-size: clamp(13px, 3.8vw, 19px);
    background: rgba(255,255,255,.35); border: 2px dashed rgba(23,50,77,.25); color: transparent; }
  .slot.on { background: #fff; border: 2px solid #ffb703; color: #17324d; box-shadow: 0 3px 0 #f4a100; }
  #dots { display: flex; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.6); border: 2px solid rgba(23,50,77,.2); }
  .dot.done { background: #ffb703; border-color: #f4a100; }
  .dot.now { background: #fff; border-color: #17324d; }
  .lane-hint { position: absolute; left: 0; right: 0; height: 2px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 14px, transparent 14px 28px); }
  .gate { position: absolute; top: 0; left: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 3; will-change: transform; }
  .gate .arch { position: absolute; inset: 0; border-radius: 48% 48% 18px 18px; border: 6px solid #fff;
    background: radial-gradient(ellipse at 50% 100%, rgba(255,255,255,.55), rgba(255,255,255,.12) 70%);
    box-shadow: 0 0 22px rgba(255,255,255,.75), inset 0 0 18px rgba(255,255,255,.6); }
  .gate .word { position: relative; padding: 6px 12px; border-radius: 14px; background: #fff; font-weight: 900; color: #17324d;
    font-size: clamp(14px, 4vw, 22px); box-shadow: 0 4px 0 rgba(23,50,77,.18); text-align: center; line-height: 1.35; max-width: 100%; }
  .gate.bonk .arch { border-color: #ff6b6b; box-shadow: 0 0 26px rgba(255,107,107,.9); }
  .gate.pass .arch { border-color: #ffd23f; box-shadow: 0 0 36px rgba(255,210,63,1), inset 0 0 22px rgba(255,210,63,.8); }
  #bird { position: absolute; top: 0; left: 0; width: 88px; height: 70px; z-index: 4; will-change: transform; transition: transform .28s cubic-bezier(.3,1.4,.5,1); }
  #bird .wing { transform-origin: 50px 30px; animation: flap .32s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: rotate(-24deg); } to { transform: rotate(26deg); } }
  #bird.hurt svg { animation: shake .4s; }
  @keyframes shake { 20% { transform: translateX(-8px) rotate(-6deg); } 40% { transform: translateX(7px) rotate(5deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
  .feather { position: absolute; width: 12px; height: 18px; border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%; z-index: 6; pointer-events: none; }
  .fly-word { position: absolute; z-index: 7; padding: 6px 12px; border-radius: 14px; background: #fff; font-weight: 900; pointer-events: none;
    box-shadow: 0 0 20px rgba(255,210,63,.9); }
  #banner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 9; pointer-events: none; }
  #banner span { font-size: clamp(30px, 10vw, 64px); font-weight: 900; color: #fff; text-shadow: 0 5px 0 #f4a100, 0 0 30px rgba(255,183,3,.8); opacity: 0; }
  .tap-hint { position: absolute; z-index: 6; pointer-events: none; font-size: 30px; }
</style>
</head>
<body>
<div id="sky">
  <div class="sun"></div>
  <svg class="isle" viewBox="0 0 400 80" preserveAspectRatio="none" style="width:100%;height:16%">
    <path d="M0 80 C40 40 90 50 130 62 C170 30 230 28 270 56 C310 40 360 44 400 70 L400 80 Z" fill="#7fd1a8"/>
    <path d="M0 80 C60 60 120 66 180 72 C240 58 320 62 400 78 L400 80 Z" fill="#4fb38a"/>
  </svg>
</div>
<div id="top">
  <div id="dots"></div>
  <div id="prompt"></div>
  <div id="strip"></div>
</div>
<div id="bird">
  <svg viewBox="0 0 100 80" width="88" height="70">
    <ellipse cx="50" cy="46" rx="30" ry="22" fill="#ffb703"/>
    <ellipse cx="56" cy="52" rx="18" ry="12" fill="#ffe08a"/>
    <path d="M78 40 L98 36 L80 48 Z" fill="#fb8500"/>
    <circle cx="68" cy="38" r="9" fill="#fff"/><circle cx="70" cy="38" r="5" fill="#17324d"/><circle cx="72" cy="36" r="1.8" fill="#fff"/>
    <path d="M22 44 L4 34 L10 48 L2 56 L22 52 Z" fill="#fb8500"/>
    <g class="wing"><path d="M50 30 C30 4 16 10 22 26 C26 36 40 40 50 36 Z" fill="#fb8500"/></g>
    <path d="M54 22 C56 12 64 12 62 20" stroke="#fb8500" stroke-width="4" fill="none" stroke-linecap="round"/>
  </svg>
</div>
<div id="banner"><span></span></div>
<script>
(function () {
  var W = 0, H = 0, lanes = [], birdX = 0, birdLane = 1;
  var items = [], itemIndex = 0, item = null, partIndex = 0, mistakes = 0;
  var wave = null, travel = 3600, last = 0, clouds = [], busy = false, done = false;
  var bird = document.getElementById('bird');
  var sky = document.getElementById('sky');

  function measure() {
    W = window.innerWidth; H = window.innerHeight;
    var top = document.getElementById('top').getBoundingClientRect().bottom + 12;
    var span = H - top - H * 0.12;
    lanes = [top + span * 0.16, top + span * 0.5, top + span * 0.84];
    birdX = W - Math.max(96, W * 0.2);
    placeBird();
  }

  function placeBird() {
    bird.style.transform = 'translate3d(' + (birdX - 44) + 'px,' + (lanes[birdLane] - 35) + 'px,0)';
  }

  function makeClouds() {
    for (var i = 0; i < 7; i++) {
      var c = document.createElement('div');
      var w = 70 + Math.random() * 120;
      c.className = 'cloud';
      c.style.width = w + 'px'; c.style.height = (w * 0.32) + 'px';
      sky.appendChild(c);
      clouds.push({ el: c, x: Math.random() * window.innerWidth, y: 40 + Math.random() * window.innerHeight * 0.75, v: 12 + Math.random() * 30, w: w });
    }
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function drawDots() {
    var dots = document.getElementById('dots');
    dots.innerHTML = '';
    items.forEach(function (_, i) { dots.appendChild(el('span', 'dot' + (i < itemIndex ? ' done' : i === itemIndex ? ' now' : ''))); });
  }

  function drawStrip() {
    var strip = document.getElementById('strip');
    strip.innerHTML = '';
    item.parts.forEach(function (part, i) {
      var s = el('span', 'slot' + (i < partIndex ? ' on' : ''), part);
      strip.appendChild(s);
    });
  }

  function startItem() {
    item = items[itemIndex]; partIndex = 0; mistakes = 0;
    document.getElementById('prompt').textContent = item.prompt || 'طِر في البوابة الصح بالترتيب';
    drawDots(); drawStrip();
    setTimeout(spawnWave, 500);
  }

  function choices() {
    var right = item.parts[partIndex];
    var pool = item.parts.slice(partIndex + 1).filter(function (p) { return p !== right; });
    items.forEach(function (other) { if (other !== item) other.parts.forEach(function (p) { if (p !== right) pool.push(p); }); });
    pool = LMS.shuffle(pool).filter(function (p, i, all) { return all.indexOf(p) === i; }).slice(0, 2);
    return LMS.shuffle([right].concat(pool));
  }

  function spawnWave() {
    if (done) return;
    var words = choices();
    var laneOrder = LMS.shuffle([0, 1, 2]).slice(0, words.length);
    var size = Math.min(150, Math.max(110, W * 0.26));
    var gateH = Math.min(96, (lanes[1] - lanes[0]) * 0.86);
    wave = { x: -size, size: size, gates: [], t: 0 };
    words.forEach(function (word, i) {
      var g = el('div', 'gate');
      g.style.width = size + 'px'; g.style.height = gateH + 'px';
      g.appendChild(el('div', 'arch'));
      g.appendChild(el('div', 'word', word));
      var lane = laneOrder[i];
      g.addEventListener('pointerdown', function () { steer(lane); });
      document.body.appendChild(g);
      wave.gates.push({ el: g, lane: lane, word: word, h: gateH });
    });
    LMS.sfx('whoosh');
  }

  function steer(lane) {
    if (busy || done) return;
    if (lane !== birdLane) { birdLane = lane; placeBird(); LMS.sfx('tap'); }
  }

  function burst(x, y, colors) {
    for (var i = 0; i < 12; i++) {
      var f = el('div', 'feather');
      f.style.background = colors[i % colors.length];
      f.style.left = x + 'px'; f.style.top = y + 'px';
      document.body.appendChild(f);
      var a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 70;
      f.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + Math.cos(a) * d + 'px,' + (Math.sin(a) * d + 40) + 'px) rotate(' + (Math.random() * 540) + 'deg)', opacity: 0 }
      ], { duration: 900 + Math.random() * 400, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = function () { this.effect.target.remove(); };
    }
  }

  function arrive() {
    busy = true;
    var right = item.parts[partIndex];
    var chosen = wave.gates.filter(function (g) { return g.lane === birdLane; })[0];
    if (chosen && chosen.word === right) {
      chosen.el.classList.add('pass');
      LMS.sfx('correct');
      burst(birdX, lanes[birdLane], ['#ffd23f', '#fff', '#fb8500']);
      flyWord(chosen, partIndex);
      partIndex++;
      setTimeout(function () {
        clearWave(); drawStrip();
        if (partIndex >= item.parts.length) itemDone(); else { busy = false; spawnWave(); }
      }, 650);
    } else {
      mistakes++;
      (chosen || wave.gates[0]).el.classList.add('bonk');
      bird.classList.add('hurt');
      LMS.sfx('wrong');
      setTimeout(function () { bird.classList.remove('hurt'); clearWave(); busy = false; spawnWave(); }, 700);
    }
  }

  function flyWord(gate, index) {
    var slot = document.getElementById('strip').children[index];
    if (!slot) return;
    var from = gate.el.getBoundingClientRect(), to = slot.getBoundingClientRect();
    var w = el('div', 'fly-word', gate.word);
    w.style.left = from.left + 'px'; w.style.top = from.top + 'px';
    document.body.appendChild(w);
    w.animate([
      { transform: 'translate(0,0) scale(1.2)' },
      { transform: 'translate(' + (to.left - from.left) + 'px,' + (to.top - from.top) + 'px) scale(.9)' }
    ], { duration: 600, easing: 'cubic-bezier(.5,0,.3,1)' }).onfinish = function () { w.remove(); };
  }

  function clearWave() {
    if (!wave) return;
    wave.gates.forEach(function (g) { g.el.remove(); });
    wave = null;
  }

  function banner(text) {
    var s = document.querySelector('#banner span');
    s.textContent = text;
    s.animate([
      { opacity: 0, transform: 'scale(.4) rotate(-8deg)' },
      { opacity: 1, transform: 'scale(1.1) rotate(2deg)', offset: .35 },
      { opacity: 1, transform: 'scale(1)', offset: .75 },
      { opacity: 0, transform: 'scale(1.3)' }
    ], { duration: 1400, easing: 'ease-out' });
  }

  function itemDone() {
    LMS.answer(item.id, mistakes === 0);
    LMS.sfx('win');
    banner(mistakes === 0 ? 'رائع!' : 'أحسنت!');
    burst(W / 2, H / 2, ['#ffd23f', '#ff6b6b', '#4cc9f0', '#80ed99', '#fff']);
    itemIndex++;
    setTimeout(function () {
      busy = false;
      if (itemIndex >= items.length) finale(); else startItem();
    }, 1500);
  }

  function finale() {
    done = true; drawDots();
    bird.style.transition = 'transform 1.4s cubic-bezier(.5,-0.3,.4,1.3)';
    bird.style.transform = 'translate3d(' + (-120) + 'px,' + (H * 0.2) + 'px,0) rotate(-20deg) scale(1.4)';
    banner('يا سلام!');
    for (var i = 0; i < 4; i++) setTimeout(function () { burst(Math.random() * W, Math.random() * H * 0.6, ['#ffd23f', '#ff6b6b', '#4cc9f0', '#80ed99']); }, i * 250);
    setTimeout(function () { LMS.finish(); }, 1600);
  }

  function frame(now) {
    var dt = last ? Math.min(50, now - last) : 16; last = now;
    clouds.forEach(function (c) {
      c.x += c.v * dt / 1000;
      if (c.x > W + 40) { c.x = -c.w - 40; c.y = 40 + Math.random() * H * 0.75; }
      c.el.style.transform = 'translate3d(' + c.x + 'px,' + c.y + 'px,0)';
    });
    if (wave && !busy) {
      wave.t += dt;
      var p = Math.min(1, wave.t / travel);
      wave.x = -wave.size + (birdX - wave.size / 2 + wave.size) * p;
      wave.gates.forEach(function (g) {
        var bob = Math.sin((now / 400) + g.lane) * 4;
        g.el.style.transform = 'translate3d(' + wave.x + 'px,' + (lanes[g.lane] - g.h / 2 + bob) + 'px,0)';
      });
      if (p >= 1) arrive();
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', measure);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp') steer(Math.max(0, birdLane - 1));
    if (e.key === 'ArrowDown') steer(Math.min(2, birdLane + 1));
  });

  LMS.onStart(function (round) {
    items = round.items.filter(function (i) { return i.kind === 'order' && i.parts && i.parts.length; });
    travel = { kids: 4200, middle: 3400, teen: 2600 }[round.stage] || 3600;
    makeClouds(); measure();
    requestAnimationFrame(frame);
    if (items.length === 0) { LMS.finish(); return; }
    startItem();
  });
})();
</script>
</body>
</html>
