<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>توأم العش</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, sans-serif; color: #2d2a1e;
    background: radial-gradient(ellipse at 50% 0%, #fff4d6 0%, #ffd98e 45%, #f5a25d 100%); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #title { position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-weight: 900; font-size: clamp(16px, 4.6vw, 24px); z-index: 4; }
  #title small { display: block; font-weight: 700; font-size: .7em; opacity: .7; margin-top: 2px; }
  #tree { position: absolute; inset: 0; }
  .branch { position: absolute; top: 72px; bottom: 24px; width: 12px; border-radius: 8px; background: linear-gradient(90deg, #7a4b23, #9c6531); }
  .col { position: absolute; top: 78px; bottom: 30px; width: 44%; display: flex; flex-direction: column; justify-content: space-evenly; z-index: 3; }
  #right { right: 3%; } #left { left: 3%; }
  .perch { position: relative; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #right .perch { flex-direction: row; } #left .perch { flex-direction: row-reverse; }
  .card { flex: 1; background: #fffdf6; border: 3px solid #e7c58a; border-radius: 16px; padding: 8px 10px; text-align: center; font-weight: 900;
    font-size: clamp(14px, 4vw, 20px); line-height: 1.3; box-shadow: 0 4px 0 #d9a95d; transition: transform .15s, border-color .15s, box-shadow .15s; word-break: break-word; }
  .perch.on .card { border-color: #3a86ff; box-shadow: 0 4px 0 #2563c9, 0 0 0 5px rgba(58,134,255,.25); transform: translateY(-3px); }
  .perch.bad .card { animation: no .45s; border-color: #ef476f; }
  @keyframes no { 25% { transform: translateX(-7px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
  .perch.gone { visibility: hidden; }
  .bird { width: 46px; height: 40px; flex: none; }
  .bird .wing { transform-origin: 26px 18px; }
  .perch.on .bird .wing { animation: flap .25s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: rotate(-20deg); } to { transform: rotate(22deg); } }
  #lines { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .flyer { position: absolute; z-index: 6; pointer-events: none; }
  .heart { position: absolute; z-index: 7; pointer-events: none; font-size: 26px; }
  #banner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 9; pointer-events: none; }
  #banner span { font-size: clamp(30px, 10vw, 64px); font-weight: 900; color: #fff; text-shadow: 0 5px 0 #c86b2a, 0 0 28px rgba(255,255,255,.8); opacity: 0; }
</style>
</head>
<body>
<div id="tree"><div class="branch" style="right:calc(3% + 44% + 6px)"></div><div class="branch" style="left:calc(3% + 44% + 6px)"></div></div>
<div id="title"><span id="prompt"></span><small id="left-count"></small></div>
<div class="col" id="right"></div>
<div class="col" id="left"></div>
<svg id="lines"></svg>
<div id="banner"><span></span></div>
<script>
(function () {
  var PALETTE = [['#ff7b54', '#ffb26b'], ['#3a86ff', '#8ec5ff'], ['#06d6a0', '#8af0cf'], ['#8338ec', '#c3a0ff'], ['#ef476f', '#ffa3b8'], ['#ffbe0b', '#ffe08a']];
  var pairs = [], batch = [], batchIndex = 0, picked = null, matched = 0, mistakes = {}, perBatch = 4;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function birdSvg(colors, flip) {
    var ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 60 50'); svg.setAttribute('class', 'bird');
    if (flip) svg.style.transform = 'scaleX(-1)';
    svg.innerHTML = '<ellipse cx="30" cy="30" rx="18" ry="14" fill="' + colors[0] + '"/><ellipse cx="33" cy="34" rx="10" ry="7" fill="' + colors[1] + '"/>' +
      '<path d="M46 26 L58 24 L47 32 Z" fill="#ffb703"/><circle cx="40" cy="24" r="5.5" fill="#fff"/><circle cx="41.5" cy="24" r="3" fill="#2d2a1e"/>' +
      '<path d="M13 28 L3 22 L6 31 L1 36 L13 34 Z" fill="' + colors[0] + '"/><g class="wing"><path d="M28 22 C16 4 7 8 10 17 C13 24 22 26 28 24 Z" fill="' + colors[0] + '" opacity=".85"/></g>';
    return svg;
  }

  function banner(text) {
    var s = document.querySelector('#banner span'); s.textContent = text;
    s.animate([{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'scale(1.1)', offset: .35 }, { opacity: 1, transform: 'scale(1)', offset: .75 }, { opacity: 0, transform: 'scale(1.25)' }], { duration: 1300, easing: 'ease-out' });
  }

  function startBatch() {
    batch = pairs.slice(batchIndex, batchIndex + perBatch);
    matched = 0; picked = null;
    var right = document.getElementById('right'), left = document.getElementById('left');
    right.innerHTML = ''; left.innerHTML = '';
    var leftOrder = LMS.shuffle(batch), rightOrder = LMS.shuffle(batch);
    rightOrder.forEach(function (p, i) { right.appendChild(perch(p, 'left', p.left, PALETTE[i % PALETTE.length], false)); });
    leftOrder.forEach(function (p, i) { left.appendChild(perch(p, 'right', p.right, PALETTE[(i + 2) % PALETTE.length], true)); });
    document.getElementById('left-count').textContent = 'وصّل ' + batch.length + ' أزواج';
    Array.prototype.forEach.call(document.querySelectorAll('.perch'), function (node, i) {
      node.animate([{ opacity: 0, transform: 'translateY(30px) scale(.8)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: i * 70, easing: 'cubic-bezier(.3,1.4,.5,1)', fill: 'backwards' });
    });
  }

  function perch(pair, side, text, colors, flip) {
    var node = el('div', 'perch');
    node.dataset.id = pair.id; node.dataset.side = side;
    var bird = birdSvg(colors, flip);
    if (side === 'left') { node.appendChild(el('div', 'card', text)); node.appendChild(bird); }
    else { node.appendChild(el('div', 'card', text)); node.appendChild(bird); }
    node.addEventListener('pointerdown', function (e) { e.preventDefault(); choose(node); });
    return node;
  }

  function choose(node) {
    if (node.classList.contains('gone')) return;
    LMS.sfx('tap');
    if (!picked || picked.dataset.side === node.dataset.side) {
      if (picked) picked.classList.remove('on');
      picked = node; node.classList.add('on');
      return;
    }
    var a = picked, b = node; picked = null;
    a.classList.remove('on');
    if (a.dataset.id === b.dataset.id) {
      var id = a.dataset.id;
      LMS.answer(id, !mistakes[id]);
      LMS.sfx('correct');
      link(a, b);
      matched++;
      if (matched === batch.length) setTimeout(batchDone, 1200);
    } else {
      mistakes[a.dataset.id] = true; mistakes[b.dataset.id] = true;
      LMS.sfx('wrong');
      [a, b].forEach(function (n) { n.classList.remove('bad'); void n.offsetWidth; n.classList.add('bad'); setTimeout(function () { n.classList.remove('bad'); }, 480); });
    }
  }

  function link(a, b) {
    var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    var svg = document.getElementById('lines'), ns = 'http://www.w3.org/2000/svg', line = document.createElementNS(ns, 'path');
    var x1 = ra.left, y1 = ra.top + ra.height / 2, x2 = rb.right, y2 = rb.top + rb.height / 2, mx = (x1 + x2) / 2;
    line.setAttribute('d', 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + (y1 - 40) + ' ' + mx + ' ' + (y2 - 40) + ' ' + x2 + ' ' + y2);
    line.setAttribute('stroke', '#ff4d6d'); line.setAttribute('stroke-width', '4'); line.setAttribute('fill', 'none'); line.setAttribute('stroke-linecap', 'round');
    svg.appendChild(line);
    var length = line.getTotalLength();
    line.style.strokeDasharray = length; line.style.strokeDashoffset = length;
    line.animate([{ strokeDashoffset: length }, { strokeDashoffset: 0 }], { duration: 350, fill: 'forwards' });
    setTimeout(function () {
      line.remove();
      [a, b].forEach(function (n, i) {
        var bird = n.querySelector('.bird'), r = bird.getBoundingClientRect(), f = bird.cloneNode(true);
        f.classList.add('flyer'); f.style.left = r.left + 'px'; f.style.top = r.top + 'px'; f.style.width = r.width + 'px'; f.style.height = r.height + 'px';
        document.body.appendChild(f);
        var tx = (window.innerWidth / 2 - r.left) + (i ? 20 : -20);
        f.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(' + tx * .6 + 'px,-60px)', offset: .5 }, { transform: 'translate(' + tx + 'px,' + (-r.top - 80) + 'px) scale(.7)' }], { duration: 1000, easing: 'ease-in' }).onfinish = function () { f.remove(); };
        n.classList.add('gone');
      });
      var h = el('div', 'heart', '💛'); h.style.left = (window.innerWidth / 2 - 13) + 'px'; h.style.top = (Math.min(ra.top, rb.top)) + 'px'; document.body.appendChild(h);
      h.animate([{ transform: 'scale(.3)', opacity: 1 }, { transform: 'translateY(-70px) scale(1.4)', opacity: 0 }], { duration: 1000 }).onfinish = function () { h.remove(); };
    }, 380);
  }

  function batchDone() {
    batchIndex += batch.length;
    if (batchIndex >= pairs.length) { LMS.sfx('win'); banner('تمام التمام!'); setTimeout(function () { LMS.finish(); }, 1600); return; }
    banner('كمان!'); LMS.sfx('whoosh');
    setTimeout(startBatch, 900);
  }

  LMS.onStart(function (round) {
    pairs = round.items.filter(function (i) { return i.kind === 'pair' && i.left && i.right; });
    perBatch = { kids: 3, middle: 4, teen: 5 }[round.stage] || 4;
    document.getElementById('prompt').textContent = 'وصّل كل عصفورة بتوأمها';
    if (pairs.length < 2) { LMS.finish(); return; }
    perBatch = Math.ceil(pairs.length / Math.ceil(pairs.length / perBatch));
    startBatch();
  });
})();
</script>
</body>
</html>
