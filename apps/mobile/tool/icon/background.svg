<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The app icon's back layer: the product's green (#0D735E, Branding.fallback) with light from the top corner. -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17A487"/>
      <stop offset=".55" stop-color="#0D735E"/>
      <stop offset="1" stop-color="#084E40"/>
    </linearGradient>
    <radialGradient id="light" cx=".22" cy=".12" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sea)"/>
  <rect width="1024" height="1024" fill="url(#light)"/>
</svg>
