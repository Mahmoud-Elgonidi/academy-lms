<!doctype html>
<!-- Google Play's feature graphic (1024×500): the icon's sea and mark with the app's own fonts.
     Drawn to tool/icon/store/feature-1024x500.png by `python3 tool/store_art.py`. -->
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<style>
  @font-face { font-family: Plex; src: url(../../../assets/fonts/IBMPlexSansArabic-600.ttf); font-weight: 600; }
  @font-face { font-family: Plex; src: url(../../../assets/fonts/IBMPlexSansArabic-400.ttf); font-weight: 400; }
  @font-face { font-family: Readex; src: url(../../../assets/fonts/ReadexPro-600.ttf); font-weight: 600; }
  html, body { margin: 0; overflow: hidden; }
  body {
    width: 1024px; height: 500px; position: relative;
    /* The icon's back layer (background.svg), stretched to the banner. */
    background:
      radial-gradient(ellipse 70% 90% at 85% 10%, rgba(255,255,255,.20), rgba(255,255,255,0) 60%),
      linear-gradient(135deg, #17A487 0%, #0D735E 55%, #084E40 100%);
    font-family: Plex, sans-serif; color: #fff;
  }
  .mark {
    position: absolute; top: 50%; right: 72px; width: 330px; height: 330px; transform: translateY(-50%);
    border-radius: 74px; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 2px rgba(255,255,255,.14);
  }
  .mark img { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px); }
  .words { position: absolute; top: 50%; right: 450px; left: 64px; transform: translateY(-50%); }
  .name { font-family: Readex, sans-serif; font-weight: 600; font-size: 84px; line-height: 1; direction: ltr; text-align: right; letter-spacing: .5px; }
  .line { margin-top: 22px; font-weight: 600; font-size: 38px; line-height: 1.35; }
  .chips { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
  .chips span { font-size: 22px; padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,.14); }
  .chips span b { color: #FFD45C; font-weight: 600; }
  .star { position: absolute; color: #FFD45C; opacity: .9; }
</style>
<body>
  <div class="mark"><img src="../mark.svg" alt=""></div>
  <div class="words">
    <div class="name">Academy</div>
    <div class="line">حصصك أونلاين مع مدرسك،<br>ورحلة تعلّم ممتعة</div>
    <div class="chips"><span>حصص مباشرة</span><span>تقارير وواجبات</span><span><b>★</b> رحلة النجوم</span></div>
  </div>
  <svg class="star" style="left:36px;top:40px" width="26" height="26" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg>
  <svg class="star" style="left:150px;bottom:44px;opacity:.55" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg>
  <svg class="star" style="right:40px;top:30px;opacity:.6" width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg>
</body>
</html>
