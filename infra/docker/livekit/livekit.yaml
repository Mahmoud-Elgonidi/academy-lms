# Local LiveKit for development (docker compose). Not for production: the
# keys are the well-known development pair, and media stays on this machine.
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  node_ip: 127.0.0.1          # the browser on this machine reaches the published ports
keys:
  devkey: local-dev-secret-not-for-production-0001   # 32+ characters, or LiveKit logs an error
room:
  empty_timeout: 600
  max_participants: 4
webhook:
  api_key: devkey
  urls:
    - http://api:8000/webhooks/livekit
logging:
  level: info
