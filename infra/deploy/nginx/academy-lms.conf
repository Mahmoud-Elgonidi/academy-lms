# Academy LMS (infra/deploy): __DOMAIN__ and every academy's subdomain, passed
# to the project's own containers on 127.0.0.1:__PORT__. Installed by
# setup-nginx.sh; nothing else on this server is served from this file.
# certbot --nginx adds the HTTPS lines to it.

map $http_upgrade $academy_lms_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name __DOMAIN__ *.__DOMAIN__;

    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # Live screens: the browsers' WebSocket connections to Reverb (/app/...).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $academy_lms_connection;
        proxy_read_timeout 120s;
    }
}
