# Who may connect to the stack's Postgres (compose.yml passes it as hba_file).
# The image's own rules, plus one: the backup part takes base backups over a
# replication connection as postgres, with its password. The port is never
# published, so "all" addresses means the stack's own network.
#
# TYPE  DATABASE      USER      ADDRESS        METHOD
local   all           all                      trust
host    all           all       127.0.0.1/32   trust
host    all           all       ::1/128        trust
local   replication   all                      trust
host    replication   all       127.0.0.1/32   trust
host    replication   all       ::1/128        trust
host    replication   postgres  all            scram-sha-256
host    all           all       all            scram-sha-256
