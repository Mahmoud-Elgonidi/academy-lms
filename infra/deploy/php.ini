; PHP settings of the production image (apps/api/Dockerfile.prod), on top of php.ini-production.
memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 55M
max_execution_time = 60
expose_php = Off

; The code never changes inside a running container: compile once.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
