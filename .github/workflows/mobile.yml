name: mobile

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/openapi/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', 'packages/openapi/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get

      # The wording lives in tool/strings.py; the ARB files and the generated
      # localizations must match it.
      - name: Translations up to date
        run: |
          python3 tool/strings.py
          flutter gen-l10n
          git diff --exit-code -- lib/core/l10n

      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      # Includes the contract test: every call the app makes must be in packages/openapi/openapi.json.
      - run: flutter test

      - name: Web build (the browser check uses it)
        run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run
