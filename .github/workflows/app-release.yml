name: app-release

# Hands the Android app to testers (apps/mobile/README.md, "Releases"):
#   on main, once the mobile checks on a commit passed (or when run by hand from the Actions tab):
#   release APKs, one per kind of phone, named after the app and its version
#   ({App}-v{version}-build{build}-{abi}.apk) and signed with the release key from the secrets;
#   a tag (app-v{version}-b{build}) and a GitHub release holding them; and each phone APK posted
#   in the testers' Telegram channel with the notes under it (the app's name, its version and
#   what changed since the last release: commits' App-Change lines, tool/release/notes.sh).
# A push to another branch that touches the Android build or this pipeline builds the APKs and
# shows the notes and the Telegram posts it would make (dry run) on the run's summary.
#
# Settings: secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD (without them the APKs carry this machine's debug key, and a phone cannot
# install one build over another), TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (optional
# TELEGRAM_THREAD_ID), FCM_API_KEY, FCM_APP_ID, FCM_SENDER_ID, FCM_PROJECT_ID (push); variables
# APP_API_BASE_URL (default https://{DEPLOY_DOMAIN}/api/v1) and GOOGLE_SERVER_CLIENT_ID.

on:
  workflow_run:
    workflows: [mobile]
    types: [completed]
    branches: [main]
  push:
    branches-ignore: [main]
    paths: ['apps/mobile/android/**', 'apps/mobile/tool/release/**', '.github/workflows/app-release.yml']
  workflow_dispatch:
    inputs:
      line:
        description: A line for the testers at the top of the message (optional)
        type: string
        required: false

concurrency:
  group: app-release-${{ github.event_name == 'push' && github.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    # From the mobile checks: only when they passed on a push to main (not a pull request).
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the tag and the GitHub release
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PUBLISH: ${{ github.event_name != 'push' }}
      API_BASE_URL: ${{ vars.APP_API_BASE_URL || format('https://{0}/api/v1', vars.DEPLOY_DOMAIN || 'progma.store') }}
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0 # the notes read the app's commits since the last release tag

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get

      # The app's name is the one under its icon; the version name is pubspec's; the build number
      # grows with every run of this workflow (Android adds 1000 × the kind of phone to it for
      # each split APK).
      - name: Version
        id: version
        run: |
          app=$(sed -n 's/.*android:label="\([^"]*\)".*/\1/p' android/app/src/main/AndroidManifest.xml | head -n 1)
          name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          {
            echo "app=$app"
            echo "name=$name"
            echo "build=$GITHUB_RUN_NUMBER"
            echo "tag=app-v$name-b$GITHUB_RUN_NUMBER"
            echo "base=$(echo "$app" | tr -c 'A-Za-z0-9_\n' '-')-v$name-build$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "kind=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APKs are signed with this machine's debug key, so testers must uninstall the previous build first (apps/mobile/README.md, Releases)."
            exit 0
          fi
          umask 077
          echo "$KEYSTORE" | base64 --decode > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "${KEY_PASSWORD:-$STORE_PASSWORD}" > android/key.properties
          echo "kind=release" >> "$GITHUB_OUTPUT"

      # Only the settings that have a value, so the app's own defaults stay for the rest.
      - name: App settings
        env:
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          keys = ['API_BASE_URL', 'FCM_API_KEY', 'FCM_APP_ID', 'FCM_SENDER_ID', 'FCM_PROJECT_ID', 'GOOGLE_SERVER_CLIENT_ID']
          defines = {k: os.environ[k] for k in keys if os.environ.get(k)}
          json.dump(defines, open('release-defines.json', 'w'))
          print('Settings in this build:', ', '.join(defines) or 'none')
          PY
          echo "API: $API_BASE_URL"

      - name: Build the APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.version.outputs.name }}" --build-number="${{ steps.version.outputs.build }}" \
            --dart-define-from-file=release-defines.json
          mkdir -p "$RUNNER_TEMP/apks"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "$RUNNER_TEMP/apks/${{ steps.version.outputs.base }}-$abi.apk"
          done
          ls -l "$RUNNER_TEMP/apks"
          rm -f android/key.properties android/app/release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.base }}
          path: ${{ runner.temp }}/apks/*.apk
          retention-days: 30

      - name: Notes for the testers
        env:
          LINE: ${{ github.event.inputs.line }}
        run: |
          bash tool/release/notes.sh "${{ steps.version.outputs.app }}" "${{ steps.version.outputs.name }}" \
            "${{ steps.version.outputs.build }}" "${{ steps.signing.outputs.kind }}" \
            "$(echo "$API_BASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')" "$LINE" > "$RUNNER_TEMP/notes.txt"
          { echo '### Notes'; echo '```'; cat "$RUNNER_TEMP/notes.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag and GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        # A re-run of the same build (say, once the Telegram secrets are in) keeps its tag and release.
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi
          gh release view "$TAG" > /dev/null 2>&1 && exit 0
          { cat "$RUNNER_TEMP/notes.txt"; echo; echo "أغلب الموبايلات: ملف arm64-v8a. الموبايلات القديمة: armeabi-v7a. المحاكي: x86_64."; } \
            > "$RUNNER_TEMP/release-notes.txt"
          gh release create "$TAG" "$RUNNER_TEMP"/apks/*.apk --prerelease \
            --title "${{ steps.version.outputs.app }} ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.build }})" \
            --notes-file "$RUNNER_TEMP/release-notes.txt"

      # Each phone APK is its own post: the file, and under it the notes with the kind of phone.
      # Off main (a push to a branch) it only shows on the summary what it would post.
      - name: Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
        run: |
          apks=("$RUNNER_TEMP/apks/${{ steps.version.outputs.base }}-arm64-v8a.apk::📲 لأغلب الموبايلات (arm64-v8a)"
            "$RUNNER_TEMP/apks/${{ steps.version.outputs.base }}-armeabi-v7a.apk::📲 للموبايلات القديمة (armeabi-v7a)")
          if [ "$PUBLISH" != true ]; then
            { echo '### Telegram (dry run)'; echo '```'; TELEGRAM_DRY_RUN=1 bash tool/release/telegram.sh "$RUNNER_TEMP/notes.txt" "${apks[@]}"; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::No TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret: the APKs are on the GitHub release only."
            exit 0
          fi
          bash tool/release/telegram.sh "$RUNNER_TEMP/notes.txt" "${apks[@]}"
