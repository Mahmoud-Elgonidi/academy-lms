name: secrets

# No secret ever enters the repository (docs/architecture/03, section 11): gitleaks
# reads the whole history on every push and pull request, with its own rules and
# the few known look-alikes in .gitleaks.toml. It is built from its tagged source
# (checked against Go's checksum database), the same way it is run locally.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.21.2

      - name: Scan the whole history
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --config .gitleaks.toml .
