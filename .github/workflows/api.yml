name: api

on:
  push:
    branches: [main]
    # The deploy (.github/workflows/deploy.yml) follows these checks on main, so a
    # change to the image or the deploy runs them too.
    paths: ['apps/api/**', 'packages/openapi/**', '.github/workflows/api.yml',
            'infra/deploy/**', '.dockerignore', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['apps/api/**', 'packages/openapi/**', '.github/workflows/api.yml']
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, mbstring, zip
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      # A dependency with a published security advisory fails the build (docs/architecture/03, section 11).
      - name: Known vulnerabilities in dependencies
        run: composer audit --no-interaction --locked

      - name: Create database roles (owner / app / platform)
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1
          -v db=lms_test -v owner_password=owner -v app_password=app -v platform_password=platform
          -f database/setup/roles.sql

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Tests (Pest, against Postgres with RLS)
        run: vendor/bin/pest

      # Scramble reads the models' columns from the database, as on a laptop:
      # the export needs the app's database (lms) migrated, not only lms_test.
      - name: Database for the OpenAPI export
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -v db=lms -v owner_password=owner -v app_password=app -v platform_password=platform \
            -f database/setup/roles.sql
          php artisan migrate --database=pgsql_owner --force

      # The apps are built from packages/openapi/openapi.json: it must say what the code does.
      - name: OpenAPI document is up to date
        run: |
          composer openapi
          git diff --exit-code -- ../../packages/openapi/openapi.json || {
            echo "::error::packages/openapi/openapi.json is out of date: run 'composer openapi' in apps/api and commit it."; exit 1; }

  # Apps already in people's phones keep working: no breaking change to the API without saying so
  # (label the pull request "api-breaking" when one is meant, with a new version for the apps).
  openapi-breaking:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'api-breaking')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@latest

      - name: No breaking changes against the base branch
        run: |
          if ! git show "origin/${{ github.base_ref }}:packages/openapi/openapi.json" > /tmp/base.json 2>/dev/null; then
            echo "The base branch has no OpenAPI document yet."; exit 0
          fi
          "$(go env GOPATH)/bin/oasdiff" breaking /tmp/base.json packages/openapi/openapi.json --fail-on ERR
