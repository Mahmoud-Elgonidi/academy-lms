# Local development: the API and back office, Postgres (with the three LMS
# roles), Redis, Mailpit, and LiveKit for the live classroom.
#
#   docker compose up            then open http://demo.localhost:8000/admin
#                                (owner@demo.test / password)
#   docker compose up -d postgres redis mailpit   services only, run PHP yourself
#
# Creates the databases lms and lms_test with the roles from
# apps/api/database/setup/roles.sql and the dev passwords in apps/api/.env.example.

services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    # The scripts are mounted as a folder (not one file) so a git pull reaches
    # a running container; start.sh then applies new packages and migrations.
    command: ["sh", "/docker/start.sh"]
    volumes:
      - ./apps/api:/app
      - ./infra/docker/api:/docker:ro
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      DB_HOST: postgres
      REDIS_HOST: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      PLATFORM_DOMAIN: localhost
      PLATFORM_DEV_ACADEMY: demo
      LIVEKIT_URL: ws://localhost:7880          # the browser connects here
      LIVEKIT_API_URL: http://livekit:7880      # the API calls the room service here
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: local-dev-secret-not-for-production-0001   # same as infra/docker/livekit/livekit.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/api/database/setup:/lms-setup:ro
      - ./infra/docker/postgres/init-lms.sh:/docker-entrypoint-initdb.d/10-init-lms.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The live classroom's video server (development keys; webhooks go to the api).
  livekit:
    image: livekit/livekit-server:v1.13.7
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./infra/docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
