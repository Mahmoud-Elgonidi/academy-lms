# Local development: the API and back office, Postgres (with the three LMS
# roles), Redis and Mailpit.
#
#   docker compose up            then open http://demo.localhost:8000/admin
#                                (owner@demo.test / password)
#   docker compose up -d postgres redis mailpit   services only, run PHP yourself
#
# Creates the databases lms and lms_test with the roles from
# apps/api/database/setup/roles.sql and the dev passwords in apps/api/.env.example.

services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./infra/docker/api/start.sh:/start.sh:ro
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      DB_HOST: postgres
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      PLATFORM_DOMAIN: localhost
      PLATFORM_DEV_ACADEMY: demo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/api/database/setup:/lms-setup:ro
      - ./infra/docker/postgres/init-lms.sh:/docker-entrypoint-initdb.d/10-init-lms.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
